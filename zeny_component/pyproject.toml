[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uaro_zeny_component"
version = "1.0.0"

[tool.setuptools]
packages = ["uaro_zeny_component"]
include-package-data = true

[tool.setuptools.package-data]
uaro_zeny_component = ["assets/*", "pyproject.toml"]
